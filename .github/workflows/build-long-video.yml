name: KP Kids Build Long Video

on:
  workflow_dispatch:
    inputs:
      payload_b64:
        description: Base64 encoded long-video payload
        required: true
        type: string
      callback_url:
        description: n8n resume callback URL
        required: true
        type: string
      callback_token:
        description: callback authentication token
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Show safe render inputs
        env:
          PAYLOAD_B64: ${{ inputs.payload_b64 }}
        run: |
          python3 - <<'PY'
          import os, json, base64
          p = json.loads(base64.b64decode(os.environ["PAYLOAD_B64"]).decode("utf-8"))
          print("KP KIDS LONG RENDER INPUTS")
          print("include_intro =", bool(p.get("include_intro")))
          print("include_closure =", bool(p.get("include_closure")))
          print("intro_drive_file_id =", p.get("intro_drive_file_id") or "")
          print("closure_drive_file_id =", p.get("closure_drive_file_id") or "")
          print("raw_proxy_base_url =", p.get("raw_proxy_base_url") or "")
          print("clip_count =", len(p.get("clips") or []))
          for i, c in enumerate((p.get("clips") or [])[:30], 1):
              print(
                  f"clip[{i}] short_id={c.get('short_id','')} "
                  f"drive_file_id={c.get('drive_file_id','')} "
                  f"has_video_url={bool(c.get('video_url') or c.get('videoUrl'))}"
              )
          PY

      - name: Build landscape long video
        id: render
        env:
          PAYLOAD_B64: ${{ inputs.payload_b64 }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          python3 long_editor.py \
            --payload-b64 "$PAYLOAD_B64" \
            --output kp_kids_long_video.mp4 \
            --meta-out long_result_meta.json \
            2>&1 | tee long_render.log

      - name: Upload long-video artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kp-kids-long-video
          path: |
            kp_kids_long_video.mp4
            long_result_meta.json
          if-no-files-found: error
          retention-days: 7

      - name: Callback n8n - success
        if: success()
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          CALLBACK_TOKEN: ${{ inputs.callback_token }}
          PAYLOAD_B64: ${{ inputs.payload_b64 }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request
          payload = json.loads(base64.b64decode(os.environ['PAYLOAD_B64']).decode('utf-8'))
          try:
              meta = json.load(open('long_result_meta.json', encoding='utf-8'))
          except Exception:
              meta = {}
          body = {
              **payload,
              'status': 'success',
              'github_run_id': os.environ['GH_RUN_ID'],
              'github_repository': os.environ['GH_REPOSITORY'],
              'artifact_name': 'kp-kids-long-video',
              'editor_result': meta,
              'message': 'KP Kids long video rendered successfully',
          }
          req = urllib.request.Request(
              os.environ['CALLBACK_URL'],
              data=json.dumps(body).encode('utf-8'),
              headers={
                  'Content-Type': 'application/json',
                  'x-kp-kids-callback': os.environ['CALLBACK_TOKEN'],
                  'User-Agent': 'KP-Kids-Long-Editor/1.0',
              },
              method='POST',
          )
          with urllib.request.urlopen(req, timeout=60) as r:
              print(r.status, r.read()[:500])
          PY

      - name: Upload long render diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kp-kids-long-video-failure-log
          path: |
            long_render.log
            long_result_meta.json
          if-no-files-found: warn
          retention-days: 7

      - name: Callback n8n - failure
        if: failure()
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          CALLBACK_TOKEN: ${{ inputs.callback_token }}
          PAYLOAD_B64: ${{ inputs.payload_b64 }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request
          try:
              payload = json.loads(base64.b64decode(os.environ['PAYLOAD_B64']).decode('utf-8'))
          except Exception:
              payload = {}
          detail = ''
          try:
              if os.path.exists('long_render.log'):
                  lines = open('long_render.log', encoding='utf-8', errors='replace').read().splitlines()
                  # Prefer the final useful part of the render log while keeping Telegram messages manageable.
                  tail = lines[-45:]
                  interesting = [
                      x for x in tail
                      if ('RuntimeError:' in x or 'Error:' in x or 'failed:' in x.lower()
                          or 'HTTPError' in x or 'urllib.error' in x or '404' in x
                          or 'Traceback' in x or 'proxy' in x.lower() or 'drive' in x.lower()
                          or 'download' in x.lower() or 'NOT landscape' in x
                          or 'Need at least' in x or 'downloaded file is too small' in x)
                  ]
                  chosen = interesting[-14:] if interesting else tail[-24:]
                  detail = '\n'.join(chosen).strip()[-1800:]
          except Exception as e:
              detail = f'Could not read render log: {e}'

          message = 'KP Kids long-video GitHub render failed'
          if detail:
              message += '\n\nREAL ERROR FROM RENDER:\n' + detail

          body = {
              **payload,
              'status': 'failed',
              'github_run_id': os.environ['GH_RUN_ID'],
              'github_repository': os.environ['GH_REPOSITORY'],
              'artifact_name': 'kp-kids-long-video',
              'message': message,
          }
          req = urllib.request.Request(
              os.environ['CALLBACK_URL'],
              data=json.dumps(body).encode('utf-8'),
              headers={
                  'Content-Type': 'application/json',
                  'x-kp-kids-callback': os.environ['CALLBACK_TOKEN'],
                  'User-Agent': 'KP-Kids-Long-Editor/1.0',
              },
              method='POST',
          )
          try:
              with urllib.request.urlopen(req, timeout=60) as r:
                  print(r.status, r.read()[:500])
          except Exception as e:
              print('Failure callback also failed:', e)
          PY
